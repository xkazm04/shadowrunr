# CI: the merge-pipeline rung of the gate ladder. Every gate here also runs locally (README,
# "Development"); this run is the one nobody's local state can pollute.
#
# Trust: this workflow needs no secrets and reads none. It runs with a read-only token
# (`contents: read`), checks out without persisting that token, and interpolates no event data
# into a shell. Pull requests from forks therefore run the same jobs with nothing to steal.
#
# Never here: the live engine (tests use the scripted engine and a fake CLI binary), Claude Code,
# Personas, the gitignored local stores (data/, policy/local/, runs/, .contest/), and the
# fidelity gate, which needs the local contest arena and stays local-only.
#
# Every action is pinned to a full commit SHA; the tag is in the comment beside it.
#
# The lane set is derived, not remembered: `node scripts/ci-lanes.mjs --check` (first web step)
# replays pnpm-workspace.yaml, every package's gate scripts (check, typecheck, test, lint, build)
# and every tools/* Python suite, and fails when one is not scheduled below, when a step names a
# package, script or suite that does not exist, or when it cannot parse a pnpm/python run line.
# Adding a gate script to a package therefore means adding its step here. Rust lanes are the one
# fixed `rust` job (root workspace plus the apps/console/src-tauri workspace) and are not part
# of that count.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail on every runner, Windows included: one failing command fails its step.
    shell: bash

env:
  # Pinned so a new stable release (and its new clippy lints) cannot turn an unchanged commit red.
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (fmt, clippy, test)
    # Windows-first: the CLI spawns child processes with CREATE_NO_WINDOW and the console ships
    # as a Windows Tauri app. apps/console/src-tauri is its own Cargo workspace, so it gets the
    # same three gates as separate `console shell` steps via --manifest-path. No frontend build
    # is needed first: these are debug builds, where tauri's generate_context! points at devUrl
    # and does not require frontendDist (../dist) to exist. A release or `tauri build` would.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The console shell is a second Cargo workspace with its own lockfile and target dir.
          workspaces: |
            .
            apps/console/src-tauri
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        # min-tests: cargo exits 0 on zero tests, so a floor (set below the current 1315) fails an emptied lane.
        run: node scripts/min-tests.mjs --min 1000 -- cargo test --workspace
      - name: console shell cargo fmt
        run: cargo fmt --manifest-path apps/console/src-tauri/Cargo.toml --all -- --check
      - name: console shell cargo clippy
        run: cargo clippy --manifest-path apps/console/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: console shell cargo test
        run: node scripts/min-tests.mjs --min 5 -- cargo test --manifest-path apps/console/src-tauri/Cargo.toml

  coverage:
    name: coverage (rust line ratchet)
    # Windows, like the rust job: the baseline in coverage/baseline.json was measured there, and
    # cfg(windows) code counts. Only the root cargo workspace; JS coverage is not measured yet.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: coverage ratchet test
        run: node --test scripts/coverage-ratchet.test.mjs
      - name: coverage report
        run: cargo llvm-cov --workspace --json --summary-only --output-path coverage/report.json
      - name: coverage ratchet
        run: node scripts/coverage-ratchet.mjs --check coverage/report.json

  web:
    name: web (tokens, contract, packages, stage, console)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contract drift gate re-exports the JSON Schema from crates/shadowrunr-types, so this
      # job builds that one small crate rather than installing Node in the Windows rust job.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No `version:` input: pnpm comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The lockfile gate: a package.json/pnpm-lock.yaml mismatch fails here. Worktrees cannot run
      # this (their node_modules is a junction), so pnpm-workspace.yaml sets verifyDepsBeforeRun: warn.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: lanes (every declared gate is scheduled here)
        run: node scripts/ci-lanes.mjs --check
      - name: lanes planner test
        run: node --test scripts/ci-lanes.test.mjs
      - name: coverage ratchet test
        run: node --test scripts/coverage-ratchet.test.mjs
      - name: coverage ratchet test (js)
        run: node --test scripts/coverage-ratchet-js.test.mjs
      - name: min-tests (zero-test floor) test
        run: node --test scripts/min-tests.test.mjs

      - name: tokens drift
        run: pnpm -C packages/tokens check
      - name: contract drift
        run: pnpm -C packages/contract check

      - name: tokens typecheck
        run: pnpm -C packages/tokens typecheck
      - name: tokens test
        run: pnpm -C packages/tokens test
      - name: contract typecheck
        run: pnpm -C packages/contract typecheck
      - name: contract test
        run: pnpm -C packages/contract test
      - name: contract lint
        run: pnpm -C packages/contract lint
      - name: stage-kit typecheck
        run: pnpm -C packages/stage-kit typecheck
      - name: stage-kit test
        run: pnpm -C packages/stage-kit test
      - name: stage-kit lint
        run: pnpm -C packages/stage-kit lint

      - name: stage typecheck
        run: pnpm -C apps/stage typecheck
      - name: stage test
        run: pnpm -C apps/stage test
      - name: stage lint (eslint; hook-compiler findings ratcheted in apps/stage/eslint-suppressions.json)
        run: pnpm -C apps/stage lint
      - name: stage build
        run: pnpm -C apps/stage build

      - name: console typecheck
        run: pnpm -C apps/console typecheck
      - name: console test (includes the DOM-count budgets)
        run: pnpm -C apps/console test
      - name: console lint (eslint, stylelint, 400-line cap, token refs)
        run: pnpm -C apps/console lint
      - name: console build (includes the per-route bundle budget)
        run: pnpm -C apps/console build

  python:
    name: python (voice, rig, avatar, avatar3d)
    # tools/voice is stdlib-only (its tests drive a fake engine, never a model); tools/rig and
    # tools/avatar need numpy and pillow; tools/avatar3d's tests need numpy and scipy (the cavity and collar tests). No model, engine binary or secret is fetched.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip install
        run: python -m pip install numpy pillow scipy
      - name: voice sidecar unittest
        working-directory: tools/voice
        run: python -m unittest discover -t . -s tests
      - name: rig unittest
        working-directory: tools/rig
        run: python -m unittest discover -t . -s tests
      - name: avatar unittest
        working-directory: tools/avatar
        run: python -m unittest test_depth_map test_learned_depth
      - name: avatar3d unittest
        working-directory: tools/avatar3d
        run: python -m unittest discover -t . -s tests
