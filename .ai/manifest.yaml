# .ai/manifest.yaml - the agent-facing contract for this repo (ai-manifest spec). Written by
# ai-registry/scripts/register-project.mjs as the minimum the fleet reads; add capability blocks
# freely - unknown fields are ignored by readers.
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-10-18"

repo:
  name: overlord

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [software-engineering, media-generation]

# Shared skills this project uses, from the registry's skills/ lane. Empty until one is linked.
skills:
  - adopt-bp
  - lens-scan
  - spark
  - contest

# Commands that exist in this repo (verified 2026-10-18; full gate re-run green on main 123d4fe+ 2026-10-25).
# Run them in a worktree as written: pnpm-workspace.yaml sets verifyDepsBeforeRun: warn, so pnpm never
# installs or purges the junctioned node_modules. Never run a plain `pnpm install` or set CI=true there.
# The test capability wraps cargo in scripts/min-tests.mjs so a lane that runs zero tests fails.
capabilities:
  build: "cargo build --workspace && cargo build --manifest-path apps/console/src-tauri/Cargo.toml && pnpm -r run build"
  test: "node scripts/min-tests.mjs --min 1000 -- cargo test --workspace && node scripts/min-tests.mjs --min 5 -- cargo test --manifest-path apps/console/src-tauri/Cargo.toml && pnpm -r run test"
  lint: "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo fmt --manifest-path apps/console/src-tauri/Cargo.toml --all -- --check && cargo clippy --manifest-path apps/console/src-tauri/Cargo.toml --all-targets -- -D warnings && pnpm -r run lint"
  typecheck: "pnpm -r run typecheck"
  # Rust line coverage per crate of the root workspace, ratcheted against coverage/baseline.json
  # (needs cargo-llvm-cov and the llvm-tools component; JS coverage is not measured yet).
  coverage: "CARGO_TARGET_DIR=C:/Users/kazda/kiro/overlord/target cargo llvm-cov --workspace --json --summary-only --output-path coverage/report.json && node scripts/coverage-ratchet.mjs --check coverage/report.json"
