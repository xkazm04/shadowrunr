# Fictional sample scene for SEG-03 (Table Read), guest the-painter (Adalwulf Hinkel). Original
# material only: a cartoon episode in the classic shape (a scheme, a town that goes along, an
# absurd escalation, the host's honest closing speech). No real person, show, place or event.
id = "the-gallery"
title = "The Hinkel Wing"
pitch = "Hinkel annexes Malakor's portrait wall, then the hallway, then the whole Spire."
guest = "the-painter"
status = "approved"
fictional = true
notes = [
    "The annexation went hallway, staircase, privy. Which step was the funniest, and which was one too many?",
    "Own it: Malakor was angrier about losing a wall of his own portraits than about anything else in the scene.",
    "Gustav the pigeon deserted twice. Should the pigeon get his own scene? Ask chat, then say honestly if that is a good idea.",
    "Certificates of having looked: name the thing in real life everyone paid for and nobody owns.",
]

[[line]]
speaker = "host"
text = "Welcome to the Spire's gallery, minions. Eleven centuries of portraits. All of me. All flattering."

[[line]]
speaker = "guest"
text = "Correction. As of this morning, this wall belongs to the Hinkel Wing. I have annexed it."

[[line]]
speaker = "host"
text = "You can't annex a wall, Hinkel. You put a lemon on it and taped a notepad underneath."

[[line]]
speaker = "guest"
text = "Decree number one: the wall is mine. Decree number two: the hallway is also mine. Gustav, guard the hallway. No. Gustav, stand near the hallway."

[[line]]
speaker = "host"
text = "Your pigeon just left."

[[line]]
speaker = "guest"
text = "Gustav is scouting. Decree number three: anyone who looks at the lemon must buy a Certificate of Having Looked. Twelve gold."

[[line]]
speaker = "host"
text = "What does the certificate give you?"

[[line]]
speaker = "guest"
text = "Proof. That you looked. It is the future of art, Bone Man. You do not own the painting. You own the looking."

[[line]]
speaker = "host"
text = "And how many have you sold?"

[[line]]
speaker = "guest"
text = "Forty. To the gargoyles. They are now very invested in the lemon. They have started guarding it. They are biting people."

[[line]]
speaker = "host"
live = "Say the unsaid: the whole Spire is paying for receipts of a lemon and defending it with teeth, and nobody, including you, wants to be the one to admit it is a lemon. Then admit the petty truth that you are mostly upset because the gargoyles never guarded your portraits."
fallback = "Let's be honest. Forty gargoyles bought proof they looked at a lemon, and now they bite to protect it. And I'm not angry about the lemon. I'm angry nobody ever bit anyone for my portraits."

[[line]]
speaker = "guest"
text = "Then a critic came. A pigeon. She said the lemon was 'fine'. FINE. Do you know what fine means, Bone Man?"

[[line]]
speaker = "host"
text = "Here we go. He's taking his glasses off."

[[line]]
speaker = "guest"
text = "Fine is what you say about soup! I gave that lemon forty years! I combed my moustache for that lemon! I am not upset. I am simply annexing the staircase."

[[line]]
speaker = "host"
text = "You can't annex the staircase, you're standing on it."

[[line]]
speaker = "guest"
text = "Then I annex the privy. The last free room. Gustav, hold the privy. Gustav? Gustav has joined the critic."

[[line]]
speaker = "host"
text = "So the empire is one wall, half a hallway, and a privy with no pigeon."

[[line]]
speaker = "guest"
text = "It is a wing. Every great gallery starts with a wing."

[[line]]
speaker = "host"
live = "The closing speech, in your own words: what tonight's little empire of lemons says about all of us, honestly, including you and your eleven centuries of self-portraits. End by giving the wall back to yourself, a little ashamed."
fallback = "You know what I realised tonight? Hinkel didn't want a gallery. He wanted someone to look. So do the gargoyles, so does chat, and so do I, with eleven centuries of my own face on that wall. Anyway. The wall is mine again. The lemon can have the privy."
