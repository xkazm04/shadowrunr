# Fictional sample scene for SEG-03 (Table Read), guest the-painter (Adalwulf Hinkel). Original
# material only: a cartoon episode in the classic shape (a scheme, a town that goes along, an
# absurd escalation, the host's honest closing speech). No real person, show, place or event.
id = "the-commission"
title = "The Painting Engine"
pitch = "The village buys a machine that paints lemons. Hinkel's new nemesis: a toaster."
guest = "the-painter"
status = "approved"
fictional = true
notes = [
    "The machine's lemon was objectively better. Say so, then ask chat whether better is the point.",
    "Hinkel's tantrum peaked at 'it does not even suffer'. Was that the best line of the scene, or the saddest?",
    "The village loved the machine for one afternoon. Name a thing chat loved for exactly one afternoon.",
]

[[line]]
speaker = "host"
text = "Big news from the village below the Spire, minions. The council has bought a Painting Engine."

[[line]]
speaker = "guest"
text = "A what?"

[[line]]
speaker = "host"
text = "It's a brass box. You put in a coin and say a word, and it paints the word. I said 'lemon'. It painted a lemon."

[[line]]
speaker = "guest"
text = "Show me. Show me this lemon. ... Hm. The shadow is on the correct side. Disgusting."

[[line]]
speaker = "host"
text = "The village has ordered four hundred lemons. They're hanging them in every window."

[[line]]
speaker = "guest"
text = "Forty years, Bone Man. Forty years I painted that lemon. The box did it in a sneeze. Gustav, we are annexing the box."

[[line]]
speaker = "host"
text = "You can't annex a box. It's bolted to the town square."

[[line]]
speaker = "guest"
text = "Then I decree that the box is a toaster. Decree number nine: all toasters must paint badly, as is tradition."

[[line]]
speaker = "host"
text = "It just painted your decree. Framed. With a better signature than yours."

[[line]]
speaker = "guest"
text = "That is it. That is it! It does not even suffer! Art is suffering! Where is its rejection letter? Where is its forty years of postcards? It has never once been told 'please stop'!"

[[line]]
speaker = "host"
live = "Say the unsaid about Hinkel's meltdown: his real complaint is that the machine skipped the suffering he thinks earned him something, and part of him is right and part of him is just jealous. Then give your own honest opinion on whether a perfect lemon nobody struggled for is worth less."
fallback = "Let's be honest. He's not angry that it paints well. He's angry it never had to want anything. And I hate to say it, but he's half right. The other half is jealousy, and I recognise it, because I felt it when the box painted my skull."

[[line]]
speaker = "guest"
text = "I will paint against it. A duel. My lemon against its lemon. The village will judge."

[[line]]
speaker = "host"
text = "The village has already gone home. They got bored of the box after lunch."

[[line]]
speaker = "guest"
text = "Bored? Of perfection? After one afternoon?"

[[line]]
speaker = "host"
text = "Four hundred lemons in four hundred windows. Turns out nobody looks at a lemon when everybody has one."

[[line]]
speaker = "guest"
text = "So I have won. By default. I accept. Gustav, the speech."

[[line]]
speaker = "host"
live = "The closing speech in your own words: what the village's one-afternoon love affair with the box says about how fast everyone gets bored of what was impossible yesterday, honestly, including you. End on a dry line about Hinkel's victory."
fallback = "You know what I realised tonight? The box didn't beat Hinkel. Boredom beat the box. The village wanted a miracle until it got four hundred of them, and that's on us, not the box. So yes, Hinkel won. By being the only lemon nobody had."
