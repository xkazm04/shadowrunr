[package]
name = "shadowrunr-engine"
description = "Universal LLM wrapper: Claude Code CLI fleet first, fallbacks behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shadowrunr-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Test double for the `claude` CLI: replays recorded stream-json fixtures so the real
# process-spawning code path is exercised without spending quota. Never shipped.
[[bin]]
name = "shadowrunr-fake-claude"
path = "src/bin/fake_claude.rs"
test = false
doc = false
