[package]
name = "shadowrunr-clips"
description = "Clip factory: moment scoring over transcripts, vertical drafts, the publish gate and dry-run upload adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

# No HTTP client on purpose: the upload adapters are dry runs that write the request they would
# send (a test pins that no network crate is a dependency).
[dependencies]
shadowrunr-types.workspace = true
shadowrunr-engine.workspace = true
shadowrunr-brain.workspace = true
shadowrunr-segments.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1"
fs2 = "0.4.0"

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
tempfile = "3.26.0"
