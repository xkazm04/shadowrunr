[package]
name = "shadowrunr-sim"
description = "Text simulation engine: chat-room clock, archetypes, judge, tournaments, reports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shadowrunr-types.workspace = true
shadowrunr-engine.workspace = true
shadowrunr-brain.workspace = true
shadowrunr-segments.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
toml = "0.8.23"
sha2 = "0.10.9"
futures = "0.3.31"
# Per-assembly nonce for the untrusted-span fence around judge input (WP14).
getrandom = "0.3.4"

[dev-dependencies]
tempfile = "3.26.0"
# A paused clock for the wall-clock sandbox tests.
tokio = { workspace = true, features = ["test-util"] }
