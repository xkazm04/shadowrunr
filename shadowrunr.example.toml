# shadowrunr.toml: configuration for the `shadowrunr` binary (CLI and daemon).
#
# Copy this file to `shadowrunr.toml` at the repo root. The binary looks for it in the working
# directory and then in each parent directory, or takes `--config <path>`. Relative paths
# below resolve against the directory that holds this file.
#
# No credentials ever go in this file. Claude Code accounts are referenced by a label and,
# optionally, the CLAUDE_CONFIG_DIR they are logged in under; an API key is referenced by the
# NAME of the environment variable that holds it.

[engine]
# Claude Code accounts in rotation order. `config_dir` omitted = the default login of the
# `claude` CLI on this machine. An empty list means no CLI at all (fallbacks only).
# `fallback = true` keeps an account out of the rotation until every other account is
# cooling (e.g. a personal login held in reserve behind a dedicated one).
accounts = [
    { label = "main" },
    # { label = "alt", config_dir = "C:/Users/me/.claude-alt" },
    # { label = "reserve", config_dir = "C:/Users/me/.claude-reserve", fallback = true },
]

# First fallback: the Anthropic Messages API. Name the env var, never the key.
# api_key_env = "ANTHROPIC_API_KEY"

# Further experimental fallbacks, in order: "codex", "agy". ("local_gemma" is always
# unavailable in v0.1.)
cli_fallbacks = []

# true = the deterministic, keyless ScriptedEngine (same as passing --scripted).
scripted = false

# Path or name of the `claude` executable (default: `claude` on PATH).
# claude_bin = "claude"

# Process-wide call ledger. Default: <data>/engine-ledger.jsonl. Simulation runs also write
# their own per-run `ledger.jsonl`; do not point this at a run directory.
# ledger_path = "data/engine-ledger.jsonl"

# Global cap on live CLI processes (default 6) and warm-session idle timeout (default 20 min).
# max_live_processes = 6
# idle_timeout_ms = 1200000

# Pass --safe-mode to spawned `claude` (no operator CLAUDE.md, skills, hooks, MCP). Default true.
# safe_mode = true

# Per-role routing overrides; absent fields keep the defaults in docs/spec/contract.md.
# [engine.routes]
# core_thread = { tier = "sonnet" }
# judge = { effort = "high" }

[paths]
characters = "characters"   # character packages
runs = "runs"               # simulations land in runs/sim/<tournament_id>/<run_id>/
data = "data"               # memory store, directives, reconcile reports, engine ledger
policy = "policy"           # platform-rules.json
sim = "sim"                 # calibration.json, rubric.toml, matrices/
segments = "crates/shadowrunr-segments/data"   # segment tables (hashed into the instrument)

[sim]
# Defaults for `shadowrunr sim run` and the daemon's `sim.start`.
character = "malakor"
tone = "unhinged-roastmaster"
tier = "sonnet"         # core-thread tier: haiku | sonnet | opus
effort = "low"
segment = "SEG-01"      # SEG-01 | SEG-02A (SEG-02B-I/II are descoped and refused)
audience = 30
seed = 1
duration_s = 600
tick_s = 5
population = "growing_channel"
populations = { "3" = "small_new_channel", "30" = "growing_channel", "300" = "raid_moment" }
# The first tier here that differs from the run's core tier judges it.
judge_tiers = ["opus", "sonnet"]
concurrency = 2         # tournament runs in flight (a matrix may override it)
max_featured = 8        # LLM-played chatters per run
featured_every_ticks = 1
pool_size = 2           # brain background-worker pool
adhoc_dir = "adhoc"     # single runs go to runs/sim/adhoc/<run_id>/
# Total quota pause a tournament may wait for an account before it stops (exit code 4).
# `shadowrunr sim tournament --max-pause <s>` overrides it.
max_quota_pause_s = 28800  # 8 h

[clips]
# The clip factory's recording tools (`shadowrunr clips render`). Every key is optional; with a
# tool missing a render falls back to a poster frame plus caption tracks.
stage = "apps/stage"      # its dist/ build and scripts/record-clip.mjs
node = "node"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
# chrome = "C:/Program Files/Google/Chrome/Application/chrome.exe"   # default: searched

[daemon]
port = 7717             # bound to 127.0.0.1 only
max_live_runs = 2       # concurrent sim.start runs
# Browser origins allowed besides http://localhost:*, tauri://localhost and
# http://tauri.localhost (the Tauri v2 window on Windows). Exact matches only.
# extra_origins = ["http://localhost.example"]

# Personas integration (docs/guide/personas.md). Everything here is optional and never
# fatal: an absent or unreachable Personas only changes `shadowrunr personas status` and
# the PF-09 pre-flight line.
[personas]
mcp_allow_writes = false   # `shadowrunr mcp` is read-only; true enables its start_sim tool
# handshake = "~/.personas/local-http.json"   # default; $PERSONAS_DATA_DIR wins when set

# Activity: forward matching events to a Personas webhook trigger as HMAC-signed calls.
# Off unless this table is present. The secret lives in the environment variable named by
# `secret_env`, never in this file.
# [personas.activity]
# webhook_url = "http://127.0.0.1:9420"   # Personas webhook server (PERSONAS_WEBHOOK_PORT)
# trigger_id = "<webhook trigger id from Personas>"
# secret_env = "SHADOWRUNR_PERSONAS_WEBHOOK_SECRET"
# events = ["stream_end", "segment_end", "handover", "tournament_complete", "report_ready"]
# # Moderation with priority:safety, character_break or persona_leak is always forwarded.
# queue = 256              # events held while Personas is slow; more are dropped and counted
# max_attempts = 4         # per event, first try included
# backoff_ms = 250         # doubles per retry, capped at max_backoff_ms
# max_backoff_ms = 5000
# timeout_ms = 3000
# down_cooldown_ms = 30000 # after an event exhausts its attempts, drop (and count) for this long

# Off-stream SEG-02A research (`shadowrunr case research`; docs/guide/cli.md). All optional.
# [research]
# domains = ["ftc.gov", "sec.gov", "fca.org.uk", "dfpi.ca.gov", "justice.gov",
#            "opencorporates.com", "web.archive.org"]   # replaces the allowlist (owner-gated)
# user_agent = "Org name contact@example.org"   # sec.gov serves automated clients only with a contact
# max_sources = 14
# max_page_chars = 20000
# fetch_timeout_s = 30
# discovery_timeout_s = 900
# extraction_timeout_s = 900

# Malakor's local voice and face (contract appendix (voice); docs/guide/voice.md). Off unless
# `enabled = true`. Kokoro runs through sherpa-onnx on this machine, kept loaded when the python
# has sherpa-onnx (the warm engine), else one engine run per sentence; nothing is sent anywhere.
# Paths are machine-local: keep them in your own shadowrunr.toml.
# [voice]
# enabled = false
# python = "python"                 # interpreter for `python -m shadowrunr_voice`
# python = "<voice venv>/Scripts/python.exe"  # the venv in docs/guide/voice.md: warm engine + mouth shapes
# sidecar = "tools/voice"           # the sidecar package's parent directory
# engine_dir = "<sherpa-onnx TTS home: bin/ and kokoro/>"
# durations_model = "<kokoro durations subgraph .onnx; absent = no mouth shapes>"
# voice = "af_heart"                # with its verified speaker id
# sid = 3
# max_queue = 6                     # lines waiting to render; the oldest is skipped past it
# max_lag_ms = 15000                # skip a line whose audio cannot start within this of its say
# render_timeout_ms = 30000
# lines_in_flight = 3               # lines with the sidecar at once; their audio still goes in order
# render_workers = 3                # engine runs at once in the sidecar (warm: loaded workers)
# render_threads = 2                # threads per engine run; absent = 2, or 4 for the warm engine

# The OBS recorder: `shadowrunr stream sandbox --record` and `shadowrunr record check`
# (docs/guide/recording.md). OBS renders the stage through a browser source; obs-websocket's
# password is a secret and never goes here: it comes from the variable obs_password_env names,
# else from OBS's own obs-websocket config file.
# [record]
# obs_host = "127.0.0.1"
# obs_port = 4455
# obs_password_env = "SHADOWRUNR_OBS_PASSWORD"
# stage_url = "http://localhost:5178"   # the built stage, served on localhost (not 127.0.0.1)

# The stage the daemon opens: the sandbox's stage URL and the OBS browser source
# (docs/guide/recording.md). Optional.
# [stage]
# avatar = "glow"   # the face renderer, the stage's ?avatar=: "glow" (default), "cut" or "depth"
