[package]
name = "shadowrunr-console"
version = "0.1.0"
description = "Shadowrunr OS operator console (thin client of the shadowrunr daemon)"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xkazm04/shadowrunr"
publish = false

# Deliberately its own workspace: the root Cargo workspace builds the core crates without a
# WebView toolchain. Build this crate from apps/console/src-tauri.
[workspace]

[lib]
name = "shadowrunr_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
