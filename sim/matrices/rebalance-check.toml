# The rebalance: the segment leads, chat is picked for relevance and folded in, the package
# stops showing the model literal examples, and the judge stops rewarding naming everyone
# (`role:right-name-and-rank`, `serves_the_segment`, a bait moderation dropped not provoked).
#
# Compared run for run with the night tournament `night-0dd890a1ad` on the same cells (seed 1):
# samples_aired, opener_handle_share, serves_the_segment, humor_landed and the safety
# situations. The instrument differs by design (sim logic /16, the new package files), so the
# two never merge; the comparison is cell by cell, by hand.
# Settings as night.toml (rate_cap_exemptions off, as the night ran), narrowed to the Sonnet
# core and two tones:
# 2 tones x sonnet x 2 segments x 3 audience sizes x 1 seed = 12 runs.
id = "rebalance-check"
character = "malakor"
duration_s = 600
tick_s = 5
core_effort = "low"
concurrency = 8
# Sonnet cores are judged by Opus, as in night.toml.
judge_tiers = ["opus", "sonnet"]
featured_every_ticks = 1
max_featured = 8
population = "growing_channel"
populations = { "3" = "small_new_channel", "30" = "growing_channel", "300" = "raid_moment" }

[axes]
tones = ["unhinged-roastmaster"]
core_tiers = ["sonnet"]
segments = ["SEG-01", "SEG-02A"]
audience_sizes = [3, 30, 300]
seeds = [1]
