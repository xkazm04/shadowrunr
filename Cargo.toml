[workspace]
resolver = "2"
members = [
    "crates/shadowrunr-types",
    "crates/shadowrunr-engine",
    "crates/shadowrunr-brain",
    "crates/shadowrunr-segments",
    "crates/shadowrunr-sim",
    "crates/shadowrunr-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xkazm04/shadowrunr"

[workspace.dependencies]
shadowrunr-types = { path = "crates/shadowrunr-types" }
shadowrunr-engine = { path = "crates/shadowrunr-engine" }
shadowrunr-brain = { path = "crates/shadowrunr-brain" }
shadowrunr-segments = { path = "crates/shadowrunr-segments" }
shadowrunr-sim = { path = "crates/shadowrunr-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
